[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liteit"
version = "0.1.0"
description = "CLI scaffolding tool for Litestar + Granian ASGI APIs with modular controllers"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "liteit contributors" }]
keywords = ["litestar", "granian", "asgi", "cli", "scaffold", "openapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0"]
docs = [
    "mkdocs>=1.5",
    "pymdown-extensions>=10.0",
]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "build>=1.0",
    "litestar[jwt]>=2.12",
    "pydantic>=2",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "httpx>=0.27",
]

[project.scripts]
liteit = "liteit.cli:main"

[project.urls]
Homepage = "https://github.com/mghorbani2357/liteit"
Documentation = "https://liteit.readthedocs.io/"
Source = "https://github.com/mghorbani2357/liteit"
Issues = "https://github.com/mghorbani2357/liteit/issues"

[tool.hatch.build.targets.wheel]
packages = ["liteit"]

[tool.hatch.build.targets.sdist]
include = [
    "/liteit",
    "/tests",
    "/docs",
    "/mkdocs.yml",
    "/.readthedocs.yaml",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build]
include = [
    "liteit/**",
    "liteit/templates/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
